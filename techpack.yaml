schemaVersion: 1
identifier: ios
displayName: "iOS Development"
description: Xcode integration, simulator management, Swift symbol navigation, and Apple documentation for Claude Code
author: Bruno Guidolim
minMCSVersion: "2026.3.6"

# ---------------------------------------------------------------------------
# Prompts — resolved interactively during `mcs sync`
# ---------------------------------------------------------------------------
prompts:
  - key: PROJECT
    type: fileDetect
    label: "Xcode project / workspace"
    detectPattern:
      - "*.xcodeproj"
      - "*.xcworkspace"

  - key: SCHEME
    type: input
    label: "Main scheme (usually matches the workspace or project name; leave blank to auto-detect)"

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:
  # ── Dependencies ────────────────────────────────────────────────────────
  - id: homebrew
    displayName: Homebrew
    description: macOS package manager
    type: brewPackage
    shell: '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
    doctorChecks:
      - type: commandExists
        name: Homebrew
        section: Dependencies
        command: brew

  - id: node
    displayName: Node.js
    description: JavaScript runtime (for the npx-based skill installer)
    dependencies: [homebrew]
    brew: node

  - id: jq
    description: JSON processor (used by simulator hook)
    dependencies: [homebrew]
    brew: jq

  - id: xcodebuildmcp-cli
    displayName: XcodeBuildMCP binary
    description: Xcode build/test/simulator CLI; provides the binary the MCP server runs
    dependencies: [homebrew]
    brew: getsentry/xcodebuildmcp/xcodebuildmcp

  - id: xcode-build-server
    displayName: xcode-build-server
    description: Build Server Protocol adapter that bridges sourcekit-lsp with xcodebuild
    dependencies: [homebrew]
    brew: xcode-build-server
    doctorChecks:
      - type: fileExists
        name: buildServer.json
        section: iOS
        path: buildServer.json
        scope: project

  # ── MCP Servers ─────────────────────────────────────────────────────────
  - id: xcodebuildmcp
    displayName: XcodeBuildMCP
    description: MCP server for Xcode build, test, and simulator workflows
    dependencies: [xcodebuildmcp-cli]
    mcp:
      name: XcodeBuildMCP
      command: xcodebuildmcp
      args:
        - "mcp"
      env:
        XCODEBUILDMCP_SENTRY_DISABLED: "1"

  - id: sosumi
    displayName: Sosumi
    description: Apple documentation search via MCP (HTTP transport)
    mcp:
      url: https://sosumi.ai/mcp

  # ── Skills ──────────────────────────────────────────────────────────────
  - id: skill-xcodebuildmcp
    displayName: xcodebuildmcp skill
    description: Loads XcodeBuildMCP tool catalog and workflow guidance
    type: skill
    dependencies: [xcodebuildmcp]
    shell: "npx -y skills add getsentry/xcodebuildmcp --skill xcodebuildmcp -g -a claude-code -y"

  # ── Plugins ─────────────────────────────────────────────────────────────
  - id: plugin-swift-lsp
    displayName: swift-lsp plugin
    description: Provides the LSP tool backed by sourcekit-lsp for symbolic navigation
    dependencies: [xcode-build-server]
    plugin: "swift-lsp@claude-plugins-official"

  # ── Commands ────────────────────────────────────────────────────────────
  - id: command-lsp-refresh
    displayName: /lsp-refresh command
    description: Rebuilds the workspace via XcodeBuildMCP to refresh the Swift LSP index
    dependencies: [xcodebuildmcp, xcode-build-server, skill-xcodebuildmcp]
    command:
      source: commands/lsp-refresh.md
      destination: lsp-refresh.md

  # ── Hooks ───────────────────────────────────────────────────────────────
  - id: hook-ios-simulator
    displayName: iOS simulator status hook
    description: Reports booted iOS simulator UUID on session start
    dependencies: [jq]
    hookEvent: SessionStart
    hook:
      source: hooks/ios-simulator-status.sh
      destination: ios-simulator-status.sh

  - id: hook-swift-lsp-status
    displayName: Swift LSP status hook
    description: Warns on session start when the Swift LSP has no cached build
    dependencies: [jq, xcode-build-server, xcodebuildmcp]
    hookEvent: SessionStart
    hook:
      source: hooks/swift-lsp-status.sh
      destination: swift-lsp-status.sh

  - id: hook-swift-lsp-nav-enforce
    displayName: Swift LSP navigation enforcement hook
    description: Blocks Read/Grep on Swift when the call shape is symbol navigation; audit shapes pass through
    dependencies: [jq, xcode-build-server, plugin-swift-lsp]
    hookEvent: PreToolUse
    hookMatcher: "Read|Grep"
    hook:
      source: hooks/swift-lsp-nav-enforce.sh
      destination: swift-lsp-nav-enforce.sh

  # ── Configuration ───────────────────────────────────────────────────────
  - id: gitignore
    displayName: Gitignore
    description: Ignores XcodeBuildMCP config directory and generated buildServer.json
    isRequired: true
    gitignore:
      - .xcodebuildmcp
      - buildServer.json

# ---------------------------------------------------------------------------
# Templates — CLAUDE.local.md sections
# ---------------------------------------------------------------------------
templates:
  - sectionIdentifier: ios
    contentFile: templates/ios.md

  - sectionIdentifier: xcodebuildmcp
    placeholders:
      - __PROJECT__
    contentFile: templates/xcodebuildmcp.md
    dependencies:
      - xcodebuildmcp

  - sectionIdentifier: swift-lsp
    contentFile: templates/swift-lsp.md
    dependencies:
      - xcode-build-server
      - plugin-swift-lsp
      - xcodebuildmcp

# ---------------------------------------------------------------------------
# Configure project script — runs during `mcs sync`
# ---------------------------------------------------------------------------
configureProject:
  script: scripts/configure-xcode.sh

# ---------------------------------------------------------------------------
# Supplementary doctor checks
# ---------------------------------------------------------------------------
supplementaryDoctorChecks:
  - type: commandExists
    name: Xcode Command Line Tools
    section: iOS
    command: xcode-select
    args: ["-p"]
    fixCommand: "xcode-select --install"
